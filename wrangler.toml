# 仅供测试：@cloudflare/vitest-pool-workers 据此搭 miniflare 环境。
# 本包是库，不部署 Worker；[vars] 均为测试假值。
name = "eventbase-test"
main = "src/index.ts"
compatibility_date = "2026-03-17"

[[d1_databases]]
binding = "DB"
database_name = "eventbase-test"
database_id = "eventbase-test"
migrations_dir = "migrations"

[vars]
EVENTBASE_APP_KEY = "test-app-key"
EVENTBASE_ADMIN_TOKEN = "test-admin-token"
